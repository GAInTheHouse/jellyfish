[project]
name = "jellyfish"
version = "0.1.0"
description = "Simulator for COMS 4444 F26 Project 4: Jellyfish"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pygame>=2.6.1",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.pyright]
venvPath = "."
venv = ".venv"
